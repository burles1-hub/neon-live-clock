<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#030617"><title>Neon Live Clock</title><style>*{box-sizing:border-box}body{margin:0;background:#030617;color:#e9eaff;font-family:-apple-system,Arial,sans-serif}.app{min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:30px 8px}.digital{font-size:clamp(48px,12vw,78px);font-weight:200;letter-spacing:3px;text-shadow:0 0 20px #7b73ff}.date{font-size:16px;color:#d7d8ff;margin:5px 0 12px}.clock{width:min(98vw,62vh,520px);aspect-ratio:1;filter:drop-shadow(0 0 12px #3429a0)}svg{width:100%;height:100%}.foot{font-size:12px;letter-spacing:2px;color:#979add;margin-top:15px}</style></head><body><main class="app"><div class="digital" id="digital">--:--</div><div class="foot" style="font-size:clamp(16px,4.3vw,22px);letter-spacing:1px;color:#a6a6ff;text-align:center;text-shadow:0 0 12px #7468ff;margin:7px 0">To my darling wife Louise ❤️</div><div class="date" id="date"></div><div class="clock"><svg viewBox="0 0 400 400"><defs><radialGradient id="face"><stop stop-color="#151357"/><stop offset=".55" stop-color="#090d32"/><stop offset="1" stop-color="#020514"/></radialGradient><linearGradient id="hand"><stop stop-color="#fff"/><stop offset=".5" stop-color="#9dbbff"/><stop offset="1" stop-color="#563dff"/></linearGradient></defs><circle cx="200" cy="200" r="191" fill="url(#face)" stroke="#6253ff" stroke-width="2"/><circle cx="200" cy="200" r="181" fill="none" stroke="#25277e" stroke-width="8"/><g id="ticks"></g><g id="numbers"></g><circle cx="200" cy="200" r="117" fill="none" stroke="#3934a5" stroke-dasharray="2 8"/><text x="200" y="110" text-anchor="middle" fill="#8b9eff" font-size="12" letter-spacing="3">LIVE • UK TIME</text><text x="200" y="144" text-anchor="middle" fill="#e4eaff" font-size="17" id="weekday"></text><text x="200" y="280" text-anchor="middle" fill="#aaa6ff" font-size="12" letter-spacing="2">NEON CHRONOGRAPH</text><g id="hour"><path d="M190 214 L195 111 Q200 95 205 111 L210 214Z" fill="url(#hand)" stroke="#fff"/></g><g id="minute"><path d="M194 217 L197 66 Q200 57 203 66 L206 217Z" fill="url(#hand)" stroke="#fff"/></g><g id="second"><path d="M199 245 L199 61 L201 61 L201 245Z" fill="#45d9ff"/></g><circle cx="200" cy="200" r="10" fill="#dcd7ff" stroke="#7466ff" stroke-width="4"/></svg></div><div aria-label="Three yellow tulips" style="display:flex;justify-content:center;margin-top:7px"><svg viewBox="0 0 260 110" role="img" aria-label="Three golden-yellow tulips with green leaves" style="width:min(68vw,250px);height:auto;filter:drop-shadow(0 0 6px #e3b731)"><defs><linearGradient id="tulipGold" x1="0" x2="1"><stop stop-color="#e69a00"/><stop offset=".35" stop-color="#fff38c"/><stop offset=".7" stop-color="#ffcb19"/><stop offset="1" stop-color="#d48a00"/></linearGradient><linearGradient id="tulipLeaf"><stop stop-color="#124e26"/><stop offset=".5" stop-color="#55b84c"/><stop offset="1" stop-color="#0a4424"/></linearGradient></defs><g stroke-linecap="round"><path d="M128 106 Q112 63 69 34 M130 106 Q133 57 131 21 M132 106 Q160 64 192 34" fill="none" stroke="#41964b" stroke-width="5"/><path d="M128 102 Q72 93 51 62 Q92 64 128 102 M130 105 Q177 91 204 64 Q155 70 130 105 M128 91 Q102 64 104 43 Q123 54 128 91" fill="url(#tulipLeaf)"/><g fill="url(#tulipGold)" stroke="#d99c13" stroke-width="1.2"><g transform="translate(67 31) rotate(-18)"><path d="M-19 -13 Q-21 12 0 20 Q21 12 19 -13 L9 -7 L0 -22 L-9 -7Z"/><path d="M-10 -8 Q-6 14 0 18 Q6 14 10 -8 L0 -21Z" fill="#ffe45b"/></g><g transform="translate(130 19)"><path d="M-23 -16 Q-24 14 0 23 Q24 14 23 -16 L11 -8 L0 -26 L-11 -8Z"/><path d="M-11 -9 Q-8 17 0 21 Q8 17 11 -9 L0 -25Z" fill="#ffe967"/></g><g transform="translate(194 31) rotate(18)"><path d="M-19 -13 Q-21 12 0 20 Q21 12 19 -13 L9 -7 L0 -22 L-9 -7Z"/><path d="M-10 -8 Q-6 14 0 18 Q6 14 10 -8 L0 -21Z" fill="#ffe45b"/></g></g></g></svg></div></main><script>const ns='http://www.w3.org/2000/svg';function el(tag,attrs,parent){let x=document.createElementNS(ns,tag);for(let k in attrs)x.setAttribute(k,attrs[k]);parent.appendChild(x);return x}for(let i=0;i<60;i++){let a=i*Math.PI/30,major=i%5===0,r1=major?166:174,r2=184;el('line',{x1:200+Math.sin(a)*r1,y1:200-Math.cos(a)*r1,x2:200+Math.sin(a)*r2,y2:200-Math.cos(a)*r2,stroke:major?'#26c9ff':'#8189d9','stroke-width':major?4:1.5},document.getElementById('ticks'))}for(let i=1;i<=12;i++){let a=i*Math.PI/6;let t=el('text',{x:200+Math.sin(a)*144,y:200-Math.cos(a)*144+8,'text-anchor':'middle',fill:'#f0efff','font-size':25},document.getElementById('numbers'));t.textContent=i}function tick(){let now=new Date(),parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'}).formatToParts(now),get=k=>Number(parts.find(x=>x.type===k).value),h=get('hour'),m=get('minute'),s=get('second')+now.getMilliseconds()/1000;document.getElementById('hour').setAttribute('transform',`rotate(${(h%12+m/60+s/3600)*30} 200 200)`);document.getElementById('minute').setAttribute('transform',`rotate(${(m+s/60)*6} 200 200)`);document.getElementById('second').setAttribute('transform',`rotate(${s*6} 200 200)`);document.getElementById('digital').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');document.getElementById('date').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);document.getElementById('weekday').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'long'}).format(now).toUpperCase();requestAnimationFrame(tick)}tick();</script></body></html>
